# Sticky-route WS traffic to gateway pods by contest_id for docker-compose.
#
# The URL is /ws/contest/{id}. hashing on $uri lets one contest
# always land on the same pod, so its Redis subscription is shared by
# every viewer of that contest (fan-out cost = O(subs), not O(users)).
#
# Docker Compose uses internal DNS — gateway service resolves to all replicas,
# nginx polls them automatically. When you scale gateway, nginx discovers new
# backends without restart.

upstream gateway_pool {
    # Consistent hash on the contest id extracted from the request URI.
    hash "$uri" consistent;

    # Docker Compose internal DNS: gateway service name resolves to all replicas.
    server gateway:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # WebSocket upgrade path — sticky by contest.
    location /ws/contest/ {
        proxy_pass http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP fallback for top-N is CDN-cacheable, no stickiness required.
    location /leaderboard/ {
        proxy_pass http://gateway_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint (optional).
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
